services:
  db:
    image: postgres:16-alpine
    profiles: ["local", "dev", "test", "prod"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todoapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todoapp_password}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoapp -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app-dev:
    build:
      context: .
      target: development
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-todoapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-todoapp_password}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
    ports:
      - "3000:3000"
      - "5173:5173"
      - "9230:9230"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:docker
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/

  app-prod:
    build:
      context: .
      target: production
    profiles: ["prod"]
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-todoapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-todoapp_password}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
